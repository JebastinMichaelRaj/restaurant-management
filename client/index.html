<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Restaurant Management System</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<nav class="navbar">
  <div class="brand">🍽️ Saffron Table</div>
  <div id="nav"></div>
</nav>

<div class="container" style="max-width:420px;">
  <div class="card">
    <div class="tabs">
      <button class="tab-btn active" id="loginTab" onclick="showForm('login')">Login</button>
      <button class="tab-btn" id="registerTab" onclick="showForm('register')">Register</button>
    </div>

    <form id="loginForm">
      <h2>Welcome back</h2>
      <label>Email</label>
      <input type="email" id="loginEmail" required />
      <label>Password</label>
      <input type="password" id="loginPassword" required />
      <div class="error" id="loginError"></div>
      <button class="btn" type="submit" style="width:100%;">Login</button>
      <p class="muted" style="margin-top:12px;">Demo accounts (password: password123):<br>
        admin@restaurant.com · chef@restaurant.com · waiter@restaurant.com · customer@restaurant.com</p>
    </form>

    <form id="registerForm" style="display:none;">
      <h2>Create an account</h2>
      <label>Full Name</label>
      <input type="text" id="regName" required />
      <label>Email</label>
      <input type="email" id="regEmail" required />
      <label>Phone</label>
      <input type="text" id="regPhone" />
      <label>Password</label>
      <input type="password" id="regPassword" required minlength="6" />
      <div class="error" id="registerError"></div>
      <button class="btn" type="submit" style="width:100%;">Register</button>
    </form>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script>
renderNav();

if (isLoggedIn()) {
  window.location.href = 'menu.html';
}

function showForm(type) {
  document.getElementById('loginForm').style.display = type === 'login' ? 'block' : 'none';
  document.getElementById('registerForm').style.display = type === 'register' ? 'block' : 'none';
  document.getElementById('loginTab').classList.toggle('active', type === 'login');
  document.getElementById('registerTab').classList.toggle('active', type === 'register');
}

document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('loginEmail').value;
  const password = document.getElementById('loginPassword').value;
  const errorEl = document.getElementById('loginError');
  errorEl.textContent = '';
  try {
    const data = await apiRequest('/auth/login', { method: 'POST', body: { email, password }, auth: false });
    localStorage.setItem('token', data.token);
    localStorage.setItem('user', JSON.stringify(data.user));
    window.location.href = 'menu.html';
  } catch (err) {
    errorEl.textContent = err.message;
  }
});

document.getElementById('registerForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const name = document.getElementById('regName').value;
  const email = document.getElementById('regEmail').value;
  const phone = document.getElementById('regPhone').value;
  const password = document.getElementById('regPassword').value;
  const errorEl = document.getElementById('registerError');
  errorEl.textContent = '';
  try {
    const data = await apiRequest('/auth/register', { method: 'POST', body: { name, email, phone, password }, auth: false });
    localStorage.setItem('token', data.token);
    localStorage.setItem('user', JSON.stringify(data.user));
    window.location.href = 'menu.html';
  } catch (err) {
    errorEl.textContent = err.message;
  }
});
</script>
</body>
</html>
