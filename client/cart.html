<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>My Orders - Saffron Table</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<nav class="navbar">
  <div class="brand">🍽️ Saffron Table</div>
  <div id="nav"></div>
</nav>

<div class="container">
  <h1>Your Cart</h1>
  <div id="cartItems" class="card"></div>

  <div class="card" style="max-width:360px;" id="billSummary"></div>

  <button class="btn secondary" id="placeOrderBtn" onclick="placeOrder()">Place Order</button>
  <div class="error" id="orderError"></div>

  <h2 style="margin-top:32px;">Order History</h2>
  <div id="orderHistory"></div>
</div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<script src="js/socket-client.js"></script>
<script>
renderNav('cart');
requireAuth();

let cart = JSON.parse(localStorage.getItem('cart') || '[]');
const TAX_RATE = 0.05;
const SERVICE_RATE = 0.10;

function renderCart() {
  const container = document.getElementById('cartItems');
  if (!cart.length) {
    container.innerHTML = '<p class="muted">Your cart is empty. Go to the Menu to add items.</p>';
    document.getElementById('billSummary').innerHTML = '';
    document.getElementById('placeOrderBtn').style.display = 'none';
    return;
  }
  document.getElementById('placeOrderBtn').style.display = 'inline-block';

  container.innerHTML = cart.map((item, idx) => `
    <div class="flex-between" style="margin-bottom:10px;">
      <div>
        <strong>${item.name}</strong>
        <div class="muted">₹${item.price} each</div>
      </div>
      <div class="flex">
        <button class="btn outline" onclick="changeQty(${idx}, -1)">-</button>
        <span>${item.quantity}</span>
        <button class="btn outline" onclick="changeQty(${idx}, 1)">+</button>
        <button class="btn danger" onclick="removeItem(${idx})">Remove</button>
      </div>
    </div>
  `).join('');

  renderBill();
}

function renderBill() {
  const subtotal = cart.reduce((s, i) => s + i.price * i.quantity, 0);
  const tax = +(subtotal * TAX_RATE).toFixed(2);
  const service = +(subtotal * SERVICE_RATE).toFixed(2);
  const total = +(subtotal + tax + service).toFixed(2);

  document.getElementById('billSummary').innerHTML = `
    <h3>Bill Summary</h3>
    <div class="flex-between"><span>Subtotal</span><span>₹${subtotal.toFixed(2)}</span></div>
    <div class="flex-between"><span>GST (5%)</span><span>₹${tax.toFixed(2)}</span></div>
    <div class="flex-between"><span>Service Charge (10%)</span><span>₹${service.toFixed(2)}</span></div>
    <hr />
    <div class="flex-between"><strong>Grand Total</strong><strong>₹${total.toFixed(2)}</strong></div>
  `;
}

function changeQty(idx, delta) {
  cart[idx].quantity += delta;
  if (cart[idx].quantity <= 0) cart.splice(idx, 1);
  localStorage.setItem('cart', JSON.stringify(cart));
  renderCart();
}

function removeItem(idx) {
  cart.splice(idx, 1);
  localStorage.setItem('cart', JSON.stringify(cart));
  renderCart();
}

async function placeOrder() {
  const errorEl = document.getElementById('orderError');
  errorEl.textContent = '';
  try {
    const items = cart.map(i => ({ foodId: i.foodId, quantity: i.quantity, customization: i.customization }));
    const order = await apiRequest('/orders', { method: 'POST', body: { items } });
    cart = [];
    localStorage.setItem('cart', '[]');
    renderCart();
    showToast(`Order placed! Total: ₹${order.grandTotal}`);
    loadOrderHistory();
  } catch (err) {
    errorEl.textContent = err.message;
  }
}

async function loadOrderHistory() {
  const container = document.getElementById('orderHistory');
  try {
    const orders = await apiRequest('/orders/my');
    if (!orders.length) {
      container.innerHTML = '<p class="muted">No past orders.</p>';
      return;
    }
    container.innerHTML = orders.map(o => `
      <div class="card">
        <div class="flex-between">
          <strong>Order #${o._id.slice(-6).toUpperCase()}</strong>
          <span class="badge ${o.status}">${o.status}</span>
        </div>
        <p class="muted">${new Date(o.createdAt).toLocaleString()}</p>
        <ul>${o.items.map(i => `<li>${i.name} × ${i.quantity} — ₹${(i.price * i.quantity).toFixed(2)}</li>`).join('')}</ul>
        <div class="flex-between"><span>Grand Total</span><strong>₹${o.grandTotal}</strong></div>
        <div class="flex-between">
          <span class="muted">Payment: ${o.paymentStatus}</span>
          ${o.paymentStatus === 'unpaid' ? `<button class="btn secondary" onclick="payOrder('${o._id}')">Pay Now</button>` : ''}
        </div>
      </div>
    `).join('');
  } catch (err) {
    container.innerHTML = `<p class="error">${err.message}</p>`;
  }
}

// Simplified mock payment confirmation (Stripe/Razorpay client SDK would
// normally collect card details here before calling this endpoint).
async function payOrder(orderId) {
  try {
    await apiRequest(`/orders/${orderId}/pay`, { method: 'POST', body: { gateway: 'stripe', paymentRef: 'demo_' + Date.now() } });
    showToast('Payment successful!');
    loadOrderHistory();
  } catch (err) {
    alert(err.message);
  }
}

socket.on('order:statusUpdated', () => loadOrderHistory());

renderCart();
loadOrderHistory();
</script>
</body>
</html>
